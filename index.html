<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Garden</title>
<style>body{font:16px system-ui;background:#f3f7ed;color:#203826;margin:0;padding:20px}main{max-width:900px;margin:auto}h1{margin-bottom:4px}.muted{color:#526557}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plot{background:white;border:2px solid #b5c9a9;border-radius:14px;padding:12px}.plot h2{margin:0 0 10px;font-size:20px}.row{display:block;width:100%;margin:7px 0;padding:14px 10px;background:#e3f0d9;border:1px solid #9fbc91;border-radius:8px;text-align:left;font:inherit;color:#203826;cursor:pointer}.row:hover{background:#cfe7c0}dialog{border:0;border-radius:16px;max-width:360px;width:85%;padding:24px;box-shadow:0 8px 35px #0003}label{display:block;margin:10px 0}input{width:100%;box-sizing:border-box;padding:10px;font:inherit}button{cursor:pointer}.actions{display:flex;gap:10px;margin-top:18px}.actions button{padding:10px 16px}#save{background:#246c3e;color:white;border:0;border-radius:7px}#cancel{border:1px solid #aaa;border-radius:7px;background:white}@media(max-width:500px){.grid{gap:8px}.plot{padding:8px}.row{font-size:14px;padding:12px 6px}}</style>
<main><h1>🌱 My Garden</h1><p class="muted">Eight 20 × 20 ft garden sections, viewed from the house. Tap a planting row to add or edit a crop. Entries are saved only in this browser.</p><p class="muted">🌿 Greenhouse: Gardens 8 and 6 (40 × 16 ft). Wood-shaving paths between beds. Garden 1 has four narrower rows.</p><div id="garden" class="grid"></div></main>
<dialog id="editor"><form id="form"><h2 id="heading"></h2><label>Vegetable / crop<input id="crop" required placeholder="e.g. Carrots"></label><label>Quantity planted<input id="quantity" type="number" min="0" step="any" placeholder="e.g. 24"></label><label>Quantity unit<input id="unit" placeholder="plants, seeds, cloves…"></label><label>Date planted<input id="date" type="date"></label><label>Expected yield<input id="yield" placeholder="e.g. 10 kg (estimate)"></label><div class="actions"><button id="save" type="submit">Save</button><button id="cancel" type="button">Cancel</button></div></form></dialog>
<script>
const key='garden-rows-v1', store=JSON.parse(localStorage.getItem(key)||'{}');
const suggestions={
8:['Staked tomatoes','Staked tomatoes','Vining crops'],
7:['Trellised tomatoes / peppers','Leafy greens','Tall crops'],
6:['Climbing tomatoes / peppers','Leafy greens','Squash'],
5:['Squash / zucchini','Onions / alliums','Trellised crops'],
4:['Squash / zucchini','Onions','Leafy greens / marigolds'],
3:['Cabbage / brassicas','Carrots / dill','Chard / beets'],
2:['Tomatoes','Lettuce / greens','Squash / zucchini'],
1:['Garlic + four companion flowers','Garlic','Garlic','Garlic']
}; // Suggestions inferred from visual reference, not confirmed crop assignments.
const grid=document.querySelector('#garden'), dialog=document.querySelector('#editor');let current;
function render(){grid.replaceChildren();for(const n of [8,7,6,5,4,3,2,1]){const plot=document.createElement('section');plot.className='plot';const h=document.createElement('h2');h.textContent='Garden '+n+(n===8||n===6?' · 🏡 Greenhouse':'');plot.append(h);for(let r=1;r<=(n===1?4:3);r++){const id=n+'-'+r,entry=store[id];const b=document.createElement('button');b.className='row';b.textContent='Row '+r+' · '+(entry?.crop||'Add a crop')+(!entry?.crop?' · Suggested: '+suggestions[n][r-1]:'')+(entry?.quantity?' ('+entry.quantity+' '+(entry.unit||'')+')':'');b.onclick=()=>edit(id,n,r);plot.append(b)}grid.append(plot)}}
function edit(id,n,r){current=id;const v=store[id]||{};document.querySelector('#heading').textContent='Garden '+n+' · Row '+r;for(const [field,value] of Object.entries({crop:v.crop||'',quantity:v.quantity||'',unit:v.unit||'',date:v.date||'',yield:v.yield||''}))document.getElementById(field).value=value;document.getElementById('crop').placeholder='Suggested: '+suggestions[n][r-1];dialog.showModal()}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const v={};for(const field of ['crop','quantity','unit','date','yield'])v[field]=document.getElementById(field).value.trim();store[current]=v;localStorage.setItem(key,JSON.stringify(store));dialog.close();render()};
document.querySelector('#cancel').onclick=()=>dialog.close();render();
</script></html>
